# Builds the desktop app for macOS, Windows and Linux and attaches it to a GitHub Release.
# Asset names carry no version so the website can link to releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output labcloud \
            target/aarch64-apple-darwin/release/labcloud \
            target/x86_64-apple-darwin/release/labcloud
      - name: Package .app and .dmg
        run: scripts/package-macos.sh labcloud "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: LabCloud-macos.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: Copy-Item target/release/labcloud.exe LabCloud-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: LabCloud-windows-x64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libvulkan-dev libfontconfig1-dev libfreetype6-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package .tar.gz and .deb
        run: |
          mkdir -p labcloud-linux && cp target/release/labcloud README.md labcloud-linux/
          tar czf LabCloud-linux-x64.tar.gz labcloud-linux
          cargo install cargo-deb --locked
          cargo deb --no-build --output LabCloud-linux-x64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            LabCloud-linux-x64.tar.gz
            LabCloud-linux-x64.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LabCloud-macos.dmg
            LabCloud-windows-x64.exe
            LabCloud-linux-x64.tar.gz
            LabCloud-linux-x64.deb
