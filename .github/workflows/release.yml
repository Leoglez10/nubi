# Builds the Tauri desktop app for macOS, Windows and Linux and attaches it to a GitHub Release.
# Asset names carry no version so the website can link to releases/latest/download/<name>.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal .app and .dmg
        run: ui/node_modules/.bin/tauri build --target universal-apple-darwin --bundles dmg
      # ponytail: unsigned; Developer ID signing and notarization need Apple certificates (PLAN Phase 8).
      - run: cp target/universal-apple-darwin/release/bundle/dmg/*.dmg nubi-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: nubi-macos.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build NSIS installer
        shell: bash
        run: ui/node_modules/.bin/tauri build --bundles nsis
      - shell: bash
        run: cp target/release/bundle/nsis/*-setup.exe nubi-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: nubi-windows-x64.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (Tauri v2 prerequisites)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build .deb and .AppImage
        run: ui/node_modules/.bin/tauri build --bundles deb,appimage
      - run: |
          cp target/release/bundle/deb/*.deb nubi-linux-x64.deb
          cp target/release/bundle/appimage/*.AppImage nubi-linux-x64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            nubi-linux-x64.deb
            nubi-linux-x64.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nubi-macos.dmg
            nubi-windows-x64.exe
            nubi-linux-x64.deb
            nubi-linux-x64.AppImage
