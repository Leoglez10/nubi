id = "lab-dynamodb"
title = "Tu primer mensaje en DynamoDB"
kind = "lab"

[[objectives]]
text = "Crea la tabla de tu intento con id como clave de partición de texto."
hint = "aws dynamodb create-table --table-name {table} --attribute-definitions AttributeName=id,AttributeType=S --key-schema AttributeName=id,KeyType=HASH --billing-mode PAY_PER_REQUEST"
check = { type = "dynamo_table" }

[[objectives]]
text = "Guarda el elemento de mensaje.json."
hint = "aws dynamodb put-item --table-name {table} --item file://mensaje.json"
check = { type = "dynamo_item" }

[[objectives]]
text = "Recupera el mensaje por su clave usando el comando de la pista."
hint = "aws dynamodb get-item --table-name {table} --key file://clave.json --consistent-read --output json"
check = { type = "dynamo_read" }

[[files]]
name = "mensaje.json"
content = '{"id":{"S":"1"},"message":{"S":"Hola Nubi"}}'

[[files]]
name = "clave.json"
content = '{"id":{"S":"1"}}'
