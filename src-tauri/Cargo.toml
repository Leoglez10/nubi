[package]
name = "nubi-desktop"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Nubi desktop app: Tauri shell over the nubi engine"
publish = false

[[bin]]
name = "nubi-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nubi = { path = "..", default-features = false }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
