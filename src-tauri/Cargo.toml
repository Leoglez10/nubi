[package]
name = "nubi-desktop"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Nubi desktop app: Tauri shell over the nubi engine"
publish = false

[[bin]]
name = "nubi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nubi = { path = ".." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"] }
