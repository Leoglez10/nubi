[package]
name = "nubi"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "Learn AWS in Spanish with local labs against AWS Emulator"
repository = "https://github.com/Leoglez10/nubi"
publish = false

[workspace]
members = ["src-tauri"]

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
serde_json = "1.0.154"

